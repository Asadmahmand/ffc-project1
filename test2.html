
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Quick Demo Page</title>
		<style>
			:root{--bg:#0f172a;--card:#111827;--text:#e6eef8;--accent:#60a5fa}
			*{box-sizing:border-box}
			body{margin:0;font-family:Inter,Segoe UI,system-ui,Arial;background:linear-gradient(180deg,#071124 0%,#0b1220 100%);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:2rem}
			.container{width:100%;max-width:900px}
			header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
			h1{font-size:1.25rem;margin:0}
			nav a{color:var(--text);text-decoration:none;margin-left:1rem;opacity:.85}
			.card{background:rgba(255,255,255,0.03);border-radius:12px;padding:1.25rem;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
			form{display:grid;grid-template-columns:1fr 320px;gap:1rem;align-items:start}
			.left{min-width:0}
			label{display:block;font-size:.85rem;margin-bottom:.35rem;color:#cfe5ff}
			input[type=text],input[type=email],textarea{width:100%;Padding:.6rem .75rem;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#071229;color:var(--text)}
			textarea{min-height:120px;resize:vertical}
			.actions{display:flex;gap:.5rem;align-items:center}
			button{background:var(--accent);border:none;color:#071229;padding:.6rem .9rem;border-radius:8px;cursor:pointer}
			.preview{padding:1rem;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.02)}
			@media (max-width:820px){form{grid-template-columns:1fr}nav{display:none}}
		</style>
	</head>
	<body>
		<div class="container">
			<header>
				<h1>Quick Demo</h1>
				<nav>
					<a href="#">Home</a>
					<a href="#">Docs</a>
					<a href="#">About</a>
				</nav>
			</header>

			<main class="card">
				<p style="margin-top:0;color:#bcd7ff">A tiny example page with a contact form and live preview.</p>
				<form id="demoForm" autocomplete="off">
					<div class="left">
						<label for="name">Name</label>
						<input id="name" name="name" type="text" placeholder="Jane Developer" />

						<label for="email">Email</label>
						<input id="email" name="email" type="email" placeholder="jane@example.com" />

						<label for="message">Message</label>
						<textarea id="message" name="message" placeholder="Tell us about your project..."></textarea>

						<div class="actions" style="margin-top:.75rem">
							<button type="submit">Send</button>
							<button type="button" id="clearBtn" style="background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text)">Clear</button>
						</div>
					</div>

					<aside class="preview">
						<strong>Live preview</strong>
						<div id="previewArea" style="margin-top:.5rem;font-size:.95rem;line-height:1.4;color:#dbeffd">
							<em>No content yet — start typing on the left.</em>
						</div>
					</aside>
				</form>
			</main>
		</div>

		<script>
			const form = document.getElementById('demoForm');
			const preview = document.getElementById('previewArea');
			const clearBtn = document.getElementById('clearBtn');

			function renderPreview(){
				const name = document.getElementById('name').value.trim();
				const email = document.getElementById('email').value.trim();
				const message = document.getElementById('message').value.trim();
				if(!name && !email && !message){
					preview.innerHTML = '<em>No content yet — start typing on the left.</em>';
					return;
				}
				preview.innerHTML = `\n+          <div><strong>${escapeHtml(name || '—')}</strong> <span style="opacity:.8">${escapeHtml(email || '')}</span></div>\n+          <div style="margin-top:.5rem">${escapeHtml(message || '—')}</div>\n+        `;
			}

			function escapeHtml(s){
				return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
			}

			form.addEventListener('input', renderPreview);

			form.addEventListener('submit', e => {
				e.preventDefault();
				// minimal validation
				const email = document.getElementById('email').value.trim();
				if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
					alert('Please enter a valid email address.');
					return;
				}
				alert('Form submitted (demo) — check console.');
				console.log('Form data:', {
					name: document.getElementById('name').value,
					email,
					message: document.getElementById('message').value
				});
			});

			clearBtn.addEventListener('click', ()=>{
				form.reset();
				renderPreview();
			});
		</script>
	</body>
</html>
